<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Prevent repeated submissions and recover from stale Stanford login requests. By stanf.org.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fix Stanford Login">
  <meta property="og:description" content="Prevent repeated submissions and recover from stale Stanford login requests. By stanf.org.">
  <meta property="og:url" content="https://fixlogin.stanf.org/">
  <meta property="og:site_name" content="Fix Stanford Login">
  <meta property="og:image" content="https://fixlogin.stanf.org/assets/share-preview-v2.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fix Stanford Login">
  <meta name="twitter:description" content="Prevent repeated submissions and recover from stale Stanford login requests. By stanf.org.">
  <meta name="twitter:image" content="https://fixlogin.stanf.org/assets/share-preview-v2.png">

</head>
<body>
  <main class="home">
    <header class="masthead">
      <h1>Fix Stanford Login</h1>
      <a class="store-button" href="https://chromewebstore.google.com/detail/fix-stanford-login/lponbkmjhdkbkedbcjidlngaepbokjmg">
        <img src="/assets/chrome.svg" width="20" height="20" alt="">
        <span class="store-label">Add to Chrome</span>
      </a>
    </header>
    <div class="comparison">
      <figure>
        <figcaption>Before</figcaption>
        <video muted playsinline preload="auto" poster="/assets/before.png" aria-label="Before: double-clicking Login leads to a stale-request error.">
          <source src="/assets/before.mp4" type="video/mp4">
          <a href="/assets/before.mp4">Watch the before video</a>.
        </video>
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <video muted playsinline preload="auto" poster="/assets/after.png" aria-label="After: the extension prevents a repeated submission and keeps the login form usable.">
          <source src="/assets/after.mp4" type="video/mp4">
          <a href="/assets/after.mp4">Watch the after video</a>.
        </video>
      </figure>
    </div>
    <footer><span>By <a href="https://stanf.org">stanf.org</a></span><a href="/privacy">Privacy</a></footer>
  </main>
