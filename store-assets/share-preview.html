<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix Stanford Login — share image source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; color: #181818; background: #fff; }
    main { padding: 40px 60px; }
    h1 { margin: 0; font-size: 64px; font-weight: 500; line-height: 1.2; letter-spacing: -2px; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 18px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; color: #666; font-size: 26px; line-height: 32px; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border: 1px solid #ededed; border-radius: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Fix Stanford Login</h1>
    <div class="comparison">
      <figure>
        <figcaption>Before</figcaption>
        <img src="../website/assets/before.png" width="960" height="720" alt="Stanford's stale-request error page.">
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <img src="../website/assets/after.png" width="960" height="720" alt="The Stanford login form remains usable.">
      </figure>
    </div>
  </main>
</body>
</html>
